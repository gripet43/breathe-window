<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF8F5"/>
    </radialGradient>
    <!-- Inside Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE8CD"/>
      <stop offset="50%" stop-color="#F7C59F"/>
      <stop offset="100%" stop-color="#E8998D"/>
    </linearGradient>
    <!-- Wood Texture Gradient -->
    <linearGradient id="woodLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B4423"/>
      <stop offset="70%" stop-color="#8C5A32"/>
      <stop offset="100%" stop-color="#A26B3C"/>
    </linearGradient>
    <linearGradient id="woodRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A26B3C"/>
      <stop offset="30%" stop-color="#8C5A32"/>
      <stop offset="100%" stop-color="#6B4423"/>
    </linearGradient>
    <!-- Drop Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3D2E21" flood-opacity="0.12"/>
    </filter>
    <filter id="windowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Base Icon Card (Squircle) -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bgGrad)" stroke="#E5E0D5" stroke-width="4" filter="url(#softShadow)"/>

  <!-- Window Frame Group -->
  <g filter="url(#windowShadow)">
    <!-- Inside Scenery -->
    <rect x="126" y="116" width="260" height="280" rx="16" fill="url(#skyGrad)"/>
    
    <!-- Glowing Sun -->
    <circle cx="256" cy="210" r="54" fill="#FFF4D6" opacity="0.9"/>
    <circle cx="256" cy="210" r="42" fill="#FFE599"/>

    <!-- Mountain Silhouettes -->
    <path d="M126 340 L190 285 L240 320 L310 260 L386 330 L386 396 L126 396 Z" fill="#8C7060" opacity="0.5"/>
    <path d="M126 360 L210 300 L270 345 L340 290 L386 340 L386 396 L126 396 Z" fill="#5C4538" opacity="0.75"/>

    <!-- Window Frame Outer Rim -->
    <rect x="120" y="110" width="272" height="292" rx="18" fill="none" stroke="#52341C" stroke-width="12"/>

    <!-- Left Open Wooden Shutter -->
    <path d="M 64 96 L 126 116 L 126 396 L 64 416 Z" fill="url(#woodLeft)" stroke="#3E2411" stroke-width="4"/>
    <line x1="78" y1="180" x2="114" y2="190" stroke="#3E2411" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="78" y1="256" x2="114" y2="266" stroke="#3E2411" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="78" y1="332" x2="114" y2="342" stroke="#3E2411" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Right Open Wooden Shutter -->
    <path d="M 448 96 L 386 116 L 386 396 L 448 416 Z" fill="url(#woodRight)" stroke="#3E2411" stroke-width="4"/>
    <line x1="434" y1="180" x2="398" y2="190" stroke="#3E2411" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="434" y1="256" x2="398" y2="266" stroke="#3E2411" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="434" y1="332" x2="398" y2="342" stroke="#3E2411" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
