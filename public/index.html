  function startDecompression() {
    document.getElementById("btnGroup").classList.add("fade-out");
    document.getElementById("locBadgeWrapper").classList.add("fade-out");
    const globeWrapper = document.getElementById("homeGlobeWrapper");
    if (globeWrapper) globeWrapper.classList.add("hidden");
    
    // 立即展示加载遮罩
    document.getElementById("loadingOverlay").classList.remove("hidden");
    cycleLoadingWords();
    
    isGenerating = true;
    apiData = null;
    apiError = null;
    
    // 引入6.0秒的人为延迟，让用户有足够时间阅读 3 句精美的载入词，并缓冲心情
    const fetchPromise = fetchDailyContent();
    const delayPromise = new Promise(resolve => setTimeout(resolve, 6000));
    
    Promise.all([fetchPromise, delayPromise])
      .then(([items]) => {
        isGenerating = false;
        stopLoadingWords();
        document.getElementById("loadingOverlay").classList.add("hidden");
        executeWindowOpen(items);
      })
      .catch(err => {
        isGenerating = false;
        stopLoadingWords();
        document.getElementById("loadingOverlay").classList.add("hidden");
        showFailState(err);
      });
  }

  function executeWindowOpen(items) {
    // 触发木窗打开的拟物音效
    AudioEngine.playWindowOpen();

    document.getElementById("shutterLeft").classList.add("open");
    document.getElementById("shutterRight").classList.add("open");
    document.getElementById("windowLight").classList.add("glowing");

    try {
      localStorage.setItem(KEY_IS_OPEN, "true");
      localStorage.setItem(KEY_OPEN_DATE, todayLabelShort());
      localStorage.setItem(KEY_ITEMS, JSON.stringify(items));
      localStorage.setItem(KEY_SLIDE_INDEX, "0");
    } catch (e) {}

    // 推开窗的一刻即已抵达：立刻写入印章手账。
    // 不再依赖用户之后走完"关上窗"仪式——直接关页面、跨日再访，这趟都不会丢。
    saveHistory({
      id: "trip_" + Date.now(),
      date: todayLabelShort(),
      time: formatTime(new Date()),
      location: LOCATIONS[currentLocationIndex].name,
      locationName: LOCATIONS[currentLocationIndex].name,
      items: items
    });

    // 开窗动画期间即开始加载首张+下一张（懒加载：不再一次性拉满 5 张）
    globalItems = items;
    loadedImages = {};
    preloadSlide(0);
    preloadSlide(1);

    setTimeout(() => {
      const wrapper = document.getElementById("windowWrapper");
      wrapper.classList.add("zoomed");
      
      document.getElementById("gateTitle").classList.add("fade-out");
      document.getElementById("gateSub").classList.add("fade-out");
      
      setTimeout(() => {
        const gate = document.getElementById("gate");
        gate.classList.add("hidden");
        
        wrapper.classList.remove("zoomed");
        document.getElementById("shutterLeft").classList.remove("open");
        document.getElementById("shutterRight").classList.remove("open");
        document.getElementById("windowLight").classList.remove("glowing");
        document.getElementById("gateTitle").classList.remove("fade-out");
        document.getElementById("gateSub").classList.remove("fade-out");
        document.getElementById("btnGroup").classList.remove("fade-out");
        document.getElementById("locBadgeWrapper").classList.remove("fade-out");

        renderCards(items);
        
        const feed = document.getElementById("feed");
        feed.classList.remove("hidden");
        feed.style.opacity = 0;
        feed.style.transform = "translateY(15px)";
        
        setTimeout(() => {
          feed.style.opacity = 1;
          feed.style.transform = "translateY(0)";
        }, 50);
      }, 1200);

    }, 800); 
  }

  // --- Stamping Ceremony & Close Window ---
  function closeWindowInteractive() {
    if (isReviewMode) {
      exitReviewMode();
      return;
    }

    // 立即标记窗口已关闭，防止动画期间用户关闭浏览器后下次打开产生重复历史
    try {
      localStorage.removeItem(KEY_IS_OPEN);
      localStorage.removeItem(KEY_OPEN_DATE);
      localStorage.removeItem(KEY_ITEMS);
      localStorage.removeItem(KEY_SLIDE_INDEX);
    } catch (e) {}

    // Trigger stamping ceremony
    const overlay = document.getElementById("stampOverlayScreen");
    const stamp = document.getElementById("ceremonyStamp");

    const loc = LOCATIONS[currentLocationIndex];
    const today = new Date();

    // 到访记录在推窗时已写入手账（见 executeWindowOpen），
    // 关窗仪式只负责盖下这枚邮票，不再重复记账。
    const serialNum = Math.max(1, getHistory().length);
    const serialStr = "第 " + String(serialNum).padStart(3, '0') + " 次开窗";

    // Set stamp design properties
    stamp.style.setProperty('--stamp-color', loc.stampColor);
    const rotDeg = (Math.random() * 8 - 4).toFixed(1) + "deg";
    stamp.style.setProperty('--stamp-rotate', rotDeg);
    
    document.getElementById("ceremonyStampEmblem").textContent = loc.emblem;
    document.getElementById("ceremonyStampName").textContent = loc.name.split(' · ')[1] || loc.name;
    document.getElementById("ceremonyStampDate").textContent = (today.getMonth() + 1) + "." + today.getDate();
    
    document.getElementById("postcardTag").textContent = "📍 " + loc.name;
    document.getElementById("postcardTime").textContent = todayLabel();
    document.getElementById("postcardSerial").textContent = serialStr;
    
    // Clean up classes
    stamp.classList.remove("stamped");
    overlay.classList.remove("hidden");
    
    // Fade overlay in (peacefully show postcard)
    setTimeout(() => {
      overlay.classList.add("visible");
      
      // Stamp begins blooming (slow ink-bleeding fade-in after 500ms)
      setTimeout(() => {
        stamp.classList.add("stamped");
        
        // Keep showing the completed postcard, then fade out and return to gate
        setTimeout(() => {
          overlay.classList.remove("visible");
          setTimeout(() => {
            overlay.classList.add("hidden");
            performGateReset();
          }, 600); // overlay fade out transition duration
          
        }, 2500); // 1.8s transition + 700ms peaceful reading
        
      }, 500);
      
    }, 50);
  }

  function performGateReset() {
    window.scrollTo({ top: 0, behavior: 'smooth' });

    const feed = document.getElementById("feed");
    feed.style.opacity = 0;
    feed.style.transform = "translateY(15px)";

    // Update visited stamp seal status immediately
    applyLocationSettings(currentLocationIndex, true);
    const globeWrapper = document.getElementById("homeGlobeWrapper");
    if (globeWrapper) globeWrapper.classList.remove("hidden");

    setTimeout(() => {
      feed.classList.add("hidden");

      const gate = document.getElementById("gate");
      const wrapper = document.getElementById("windowWrapper");
      
      document.getElementById("shutterLeft").classList.add("open");
      document.getElementById("shutterRight").classList.add("open");
      document.getElementById("windowLight").classList.add("glowing");
      
      document.getElementById("btnGroup").classList.add("fade-out");
      document.getElementById("locBadgeWrapper").classList.add("fade-out");
      document.getElementById("gateTitle").classList.add("fade-out");
      document.getElementById("gateSub").classList.add("fade-out");

      wrapper.classList.add("zoomed");
      
      const originalTransition = wrapper.style.transition;
      wrapper.style.transition = 'none';
      
      gate.classList.remove("hidden");
      gate.style.opacity = 1;
      gate.style.transform = "translateY(0)";
      
      wrapper.offsetHeight;
      wrapper.style.transition = originalTransition;
      
      wrapper.classList.remove("zoomed");
      document.getElementById("gateTitle").classList.remove("fade-out");
      document.getElementById("gateSub").classList.remove("fade-out");
      document.getElementById("locBadgeWrapper").classList.remove("fade-out");
      
      setTimeout(() => {
        document.getElementById("shutterLeft").classList.remove("open");
        document.getElementById("shutterRight").classList.remove("open");
        document.getElementById("windowLight").classList.remove("glowing");
        
        setTimeout(() => {
          document.getElementById("btnGroup").classList.remove("fade-out");
        }, 800);

      }, 1200);

    }, 200);
  }

  function showFailState(err) {
    document.getElementById("failReason").textContent = err.message || "未知错误";
    document.getElementById("btnGroup").classList.remove("fade-out");
    document.getElementById("locBadgeWrapper").classList.remove("fade-out");
    show("fail");
  }

  // --- 加载文字轮播模块 ---
  let loadingTimer = null;
  function cycleLoadingWords() {
    const loc = LOCATIONS[currentLocationIndex];
    const words = getLoadingWords(loc.name);
    let i = 0;
    const el = document.getElementById("loadingWord");
    el.textContent = words[0];
    loadingTimer = setInterval(() => {
      i = (i + 1) % words.length;
      el.style.opacity = 0;
      setTimeout(() => { el.textContent = words[i]; el.style.opacity = 1; }, 300);
    }, 2000);
  }
  function stopLoadingWords() {
    if (loadingTimer) { clearInterval(loadingTimer); loadingTimer = null; }
  }

  /* ——— 治愈系 BGM 混音音效引擎 (Web Audio API Engine) ——— */
  const AudioEngine = {
    ctx: null,
    bgmGain: null,
    bgmURL: './assets/audio/healing_bgm.m4a',
    FADE_SECONDS: 2.0,
    voices: [],
    activeVoice: 0,
    degraded: false,
    loopTimer: null,
    sfxBuffer: null,
    isPlaying: false,

    init() {
      if (this.ctx) return;
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      this.ctx = new AudioCtx();
      this.bgmGain = this.ctx.createGain();
      this.bgmGain.gain.value = 0;
      this.bgmGain.connect(this.ctx.destination);

      // 双声道交叉淡化循环：音乐文件末尾 2 秒与开头 2 秒是同一段乐句，
      // 原生 loop 在接缝处会出现可闻的淡出/淡入断档。改为距结尾 2 秒时
      // 让另一声道从 0 起播并交叉淡化——两声道同乐句同相位，叠加振幅恒定，接缝不可闻。
      this.voices = [this.createVoice(), this.createVoice()];
      this.degraded = this.voices.some(v => !v.gain);
      if (this.degraded) this.voices.length = 1;

      this.loadSfx();
    },

    createVoice() {
      const el = new Audio();
      el.src = this.bgmURL;
      el.preload = 'auto';
      const voice = { el, gain: null };
      try {
        const node = this.ctx.createMediaElementSource(el);
        voice.gain = this.ctx.createGain();
        voice.gain.gain.value = 0;
        node.connect(voice.gain);
        voice.gain.connect(this.bgmGain);
        el.addEventListener('ended', () => this.onVoiceEnded(voice));
      } catch(e) {
        el.loop = true; // 音频图无法构建时退回原生循环
      }
      return voice;
    },

    onVoiceEnded(voice) {
      // 兜底：若调度器错过交接时机（如后台标签页节流），立即让另一声道接管
      if (!this.isPlaying || this.degraded) return;
      if (this.voices[this.activeVoice] !== voice) return;
      this.crossfadeTo(this.voices[1 - this.activeVoice], 0.3);
    },

    crossfadeTo(next, fadeSec) {
      if (this.degraded || !this.ctx) return;
      const prev = this.voices[this.activeVoice];
      const now = this.ctx.currentTime;

      next.gain.gain.cancelScheduledValues(now);
      next.gain.gain.setValueAtTime(0, now);
      next.gain.gain.linearRampToValueAtTime(1, now + fadeSec);
      try { next.el.currentTime = 0; } catch(e) {}
      next.el.play().catch(e => console.log('BGM voice blocked:', e));

      prev.gain.gain.cancelScheduledValues(now);
      prev.gain.gain.setValueAtTime(prev.gain.gain.value, now);
      prev.gain.gain.linearRampToValueAtTime(0, now + fadeSec);
      setTimeout(() => {
        if (this.voices[this.activeVoice] !== prev) prev.el.pause();
      }, fadeSec * 1000 + 80);

      this.activeVoice = this.voices.indexOf(next);
      this.scheduleHandoff();
    },

    scheduleHandoff() {
      clearInterval(this.loopTimer);
      if (this.degraded) return;
      this.loopTimer = setInterval(() => {
        if (!this.isPlaying || !this.ctx) return;
        const v = this.voices[this.activeVoice];
        const d = v.el.duration;
        if (!d || isNaN(d) || !isFinite(d)) return;
        const fade = Math.min(this.FADE_SECONDS, d / 3);
        if (v.el.currentTime >= d - fade) {
          this.crossfadeTo(this.voices[1 - this.activeVoice], fade);
        }
      }, 200);
    },

    async loadSfx() {
      try {
        const resp = await fetch('./assets/audio/window_open.wav');
        if (resp.ok) {
          const arrayBuf = await resp.arrayBuffer();
          this.sfxBuffer = await this.ctx.decodeAudioData(arrayBuf);
        }
      } catch(e) {}
    },

    async toggle() {
      if (!this.ctx) this.init();
      if (this.ctx && this.ctx.state === 'suspended') {
        await this.ctx.resume();
      }
      if (this.isPlaying) {
        this.disable();
      } else {
        await this.enable();
      }
    },

    async enable() {
      if (!this.ctx) this.init();
      if (this.ctx && this.ctx.state === 'suspended') {
        await this.ctx.resume();
      }

      this.isPlaying = true;
      this.updateUI();
      try { localStorage.setItem(KEY_BGM, 'enabled'); } catch(e) {}

      const v = this.voices[this.activeVoice];
      if (v) {
        if (!this.degraded && v.gain) {
          const other = this.voices[1 - this.activeVoice];
          const now = this.ctx.currentTime;
          v.gain.gain.cancelScheduledValues(now);
          v.gain.gain.setValueAtTime(1, now);
          if (other && other.gain) {
            other.gain.gain.cancelScheduledValues(now);
            other.gain.gain.setValueAtTime(0, now);
            other.el.pause();
          }
        }
        v.el.play().catch(e => console.log('Autoplay blocked:', e));
        this.scheduleHandoff();
      }

      // 平滑 1.5 秒渐入
      if (this.ctx) {
        const now = this.ctx.currentTime;
        this.bgmGain.gain.cancelScheduledValues(now);
        this.bgmGain.gain.setValueAtTime(this.bgmGain.gain.value, now);
        this.bgmGain.gain.linearRampToValueAtTime(0.35, now + 1.5);
      }
    },

    disable() {
      this.isPlaying = false;
      this.updateUI();
      try { localStorage.setItem(KEY_BGM, 'disabled'); } catch(e) {}

      clearInterval(this.loopTimer);
      if (!this.ctx) return;
      // 平滑 1.0 秒渐出
      const now = this.ctx.currentTime;
      this.bgmGain.gain.cancelScheduledValues(now);
      this.bgmGain.gain.setValueAtTime(this.bgmGain.gain.value, now);
      this.bgmGain.gain.linearRampToValueAtTime(0.0, now + 1.0);

      setTimeout(() => {
        if (!this.isPlaying) {
          this.voices.forEach(voice => voice.el.pause());
        }
      }, 1000);
    },

    playWindowOpen() {
      if (!this.ctx) this.init();
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }

      if (this.sfxBuffer) {
        try {
          const sfx = this.ctx.createBufferSource();
          const gain = this.ctx.createGain();
          gain.gain.value = 0.5;
          sfx.buffer = this.sfxBuffer;
          sfx.connect(gain);
          gain.connect(this.ctx.destination);
          sfx.start(0);
          return;
        } catch(e) {}
      }
      this.synthCreak();
    },

    synthCreak() {
      if (!this.ctx) return;
      try {
        const now = this.ctx.currentTime;
        const masterGain = this.ctx.createGain();
        masterGain.connect(this.ctx.destination);

        // 温暖的木框叩击声：低频正弦波 + 快速衰减包络
        const freqs = [120, 200, 380];
        const gains = [0.55, 0.25, 0.08];
        const decays = [18, 22, 50];

        freqs.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          // 轻微音调下滑，模拟木头共鸣
          osc.frequency.exponentialRampToValueAtTime(freq * 0.85, now + 0.4);
          g.gain.setValueAtTime(gains[idx] * 0.5, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          osc.connect(g);
          g.connect(masterGain);
          osc.start(now);
          osc.stop(now + 0.55);
        });
      } catch(e) {}
    },

    updateUI() {
      const toggleBtn = document.getElementById('bgmToggle');
      const iconSpan = document.getElementById('bgmIcon');
      const eqSpan = document.getElementById('bgmEqualizer');
      if (!toggleBtn) return;

      if (this.isPlaying) {
        toggleBtn.classList.add('playing');
        if (iconSpan) iconSpan.innerText = '🎶';
        if (eqSpan) eqSpan.classList.remove('hidden');
      } else {
        toggleBtn.classList.remove('playing');
        if (iconSpan) iconSpan.innerText = '🎵';
        if (eqSpan) eqSpan.classList.add('hidden');
      }
    }
  };

  function toggleBGM() {
    AudioEngine.toggle();
  }

  async function boot() {
    document.getElementById("date").textContent = todayLabel();
    document.getElementById("loadingWord").style.transition = "opacity 0.3s ease";

    try {
      if (localStorage.getItem(KEY_BGM) === 'enabled') {
        const unlock = () => {
          AudioEngine.enable();
          window.removeEventListener('click', unlock);
          window.removeEventListener('touchstart', unlock);
        };
        window.addEventListener('click', unlock, { once: true });
        window.addEventListener('touchstart', unlock, { once: true });
      }
    } catch(e) {}

    // 动态加载所有选址元数据 locations.json
    try {
      const response = await fetch("./assets/data/locations.json");
      if (response.ok) {
        const rawData = await response.json();
        
        // 读取上次保存的城市名称（按名称恢复，避免过滤后索引错位）
        let savedCityName = null;
        try {
          savedCityName = localStorage.getItem(KEY_LOCATION_NAME);
        } catch(e) {}

        // 保存全部城市（用于地图展示 300 个坐标点）
        ALL_LOCATIONS.length = 0;
        ALL_LOCATIONS.push(...rawData);

        // 只保留具有全部专属插画的城市（用于开窗选择）
        const data = rawData.filter(loc => loc.hasCustomImages === true);

        LOCATIONS.length = 0;
        LOCATIONS.push(...data);

        if (savedCityName) {
          const newIdx = LOCATIONS.findIndex(l => l.name === savedCityName);
          currentLocationIndex = (newIdx !== -1) ? newIdx : 0;
        }
      } else {
        console.error("加载 locations.json 失败:", response.statusText);
      }
    } catch (e) {
      console.error("网络请求 locations.json 失败:", e);
    }
    
    // 确保当前索引合法
    if (currentLocationIndex >= LOCATIONS.length) {
      currentLocationIndex = 0;
    }
    
    if (LOCATIONS.length > 0) {
      await initHomeGlobe();
      applyLocationSettings(currentLocationIndex, true);
    }

    // 城市定位完成，门槛页统一揭幕：用户第一眼看到的就是上次选择的那扇窗，
    // 不再有"默认城市闪一下再跳走"的割裂感（加载失败时也揭幕，展示静态兜底窗）
    document.getElementById("gate").classList.remove("pre-boot");
    updateImprintsCount();

    try {
      const isOpen = localStorage.getItem(KEY_IS_OPEN);
      if (isOpen === "true") {
        // 日期校验：如果开窗日期不是今天，自动重置（新的一天可以重新开窗）
        const openDate = localStorage.getItem(KEY_OPEN_DATE);
        const isStaleOpen = openDate !== todayLabelShort();
        if (isStaleOpen) {
          localStorage.removeItem(KEY_IS_OPEN);
          localStorage.removeItem(KEY_OPEN_DATE);
          localStorage.removeItem(KEY_ITEMS);
          localStorage.removeItem(KEY_SLIDE_INDEX);
        } else {
          const savedItems = localStorage.getItem(KEY_ITEMS);
          if (savedItems) {
            const items = JSON.parse(savedItems);

            const hasFallbackImage = items.some(item =>
              item.image && (
                item.image.includes("world_corner.png") ||
                item.image.includes("science_nature.png") ||
                item.image.includes("others_present.png") ||
                item.image.includes("spark_of_thought.png") ||
                item.image.includes("old_knowledge.png")
              )
            );
            const loc = LOCATIONS[currentLocationIndex];
            const isOutdatedCache = loc && loc.hasCustomImages && hasFallbackImage;

            const isOldFormat = !Array.isArray(items) ||
                                items.some(item => !item.image || item.image.startsWith('http') || item.image.includes('picsum')) ||
                                isOutdatedCache;
            if (isOldFormat) {
              localStorage.removeItem(KEY_IS_OPEN);
              localStorage.removeItem(KEY_OPEN_DATE);
              localStorage.removeItem(KEY_ITEMS);
              localStorage.removeItem(KEY_SLIDE_INDEX);
            } else {
              document.getElementById("btnGroup").classList.add("fade-out");
              document.getElementById("locBadgeWrapper").classList.add("fade-out");
              document.getElementById("gate").classList.add("hidden");
              const globeWrapper = document.getElementById("homeGlobeWrapper");
              if (globeWrapper) globeWrapper.classList.add("hidden");

              renderCards(items);

              const feed = document.getElementById("feed");
              feed.classList.remove("hidden");
              feed.style.opacity = 1;
              feed.style.transform = "translateY(0)";
              return;
            }
          }
        }
      }
    } catch (e) { /* 读取失败 */ }

    show("gate");
  }

  boot();

  // 落款（#aiNote）置于 body 直属、fixed 于视口右下角；
  // 门廊的 .hidden 在多处被切换，这里用 MutationObserver 统一兜住，
  // 保证落款只在首页（门廊可见时）出现。
  (function syncAiNoteWithGate() {
    const gate = document.getElementById("gate");
    const note = document.getElementById("aiNote");
    if (!gate || !note) return;
    const sync = () => note.classList.toggle("hidden", gate.classList.contains("hidden"));
    sync();
    new MutationObserver(sync).observe(gate, { attributes: true, attributeFilter: ["class"] });
  })();
</script>
